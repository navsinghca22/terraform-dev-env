name: Release

# Fires when you push a tag like v1.0.0:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab, supplying a version. The manual
# path creates the tag for you.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
        type: string

# The default GITHUB_TOKEN is read-only for contents. Without this,
# `gh release create` fails with a 403 and no useful explanation.
permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # --generate-notes diffs against the previous tag, so it needs the
          # full history. The default shallow clone produces empty notes.
          fetch-depth: 0

      - name: Create tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            --title "$TAG" \
            --verify-tag

      - name: Summary
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          {
            echo "### Released \`$TAG\`"
            echo
            echo "<${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG>"
          } >> "$GITHUB_STEP_SUMMARY"
